name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Run tests
        run: zig build test

      - name: Build WASM
        run: zig build wasm -Doptimize=ReleaseFast

      - name: Verify WASM output
        run: |
          test -f zig-out/pixel-to-ascii-wasm.wasm
          echo "WASM file size: $(wc -c < zig-out/pixel-to-ascii-wasm.wasm) bytes"
